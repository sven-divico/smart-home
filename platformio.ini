; ESP-Claw garden system — one repo, one PlatformIO project, multiple build envs.
; Two kinds of env:
;   * device envs (one per node role) — real hardware, framework = arduino
;   * host_sim — native build of the shared UI code that dumps page previews to
;     PGM, so layouts can be iterated on the Mac without flashing (see docs).
; Shared, target-agnostic UI lives in src/ui/** and compiles into both.

[platformio]
default_envs = display_controller

[env]
; Only truly target-agnostic settings here — host_sim (native) inherits this too,
; so it must NOT contain platform/framework.
build_flags =
  -D CORE_DEBUG_LEVEL=3

; --------------------------------------------------------------------------
; Display controller — Elecrow CrowPanel ESP32 5.79" e-paper (ESP32-S3, 8MB/8MB).
; --------------------------------------------------------------------------
[env:display_controller]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 460800   ; CH340 bridge on this CrowPanel is unreliable at 921600
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
; Compile everything under src/ EXCEPT the host-only preview entry point.
build_src_filter = +<*> -<host_preview.cpp>
build_flags =
  ${env.build_flags}
  -D BOARD_HAS_PSRAM
  -D ROLE_DISPLAY_CONTROLLER
  -D DEVICE_NAME=\"display-epaper-01\"
  -D NODE_ID=3
  -D USE_DISPLAY

; --------------------------------------------------------------------------
; Host preview — native build of the shared UI; renders pages to PGM on the Mac.
; Compiles ONLY the portable UI (src/ui/**) + the host entry point. The Arduino
; e-paper driver is ignored (it can't and needn't build off-device).
; --------------------------------------------------------------------------
[env:host_sim]
platform = native
build_src_filter = -<*> +<ui/> +<host_preview.cpp>
lib_ignore = CrowPanelEPD
build_flags =
  -std=gnu++17
  -D HOST_PREVIEW
