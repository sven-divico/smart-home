; ESP-Claw garden system — one repo, one PlatformIO project, multiple build envs (one per node role).
; Mission 1 target: the indoor e-paper display node (CrowPanel ESP32 5.79", 792x272, 1-bit).

[platformio]
default_envs = display_controller

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 460800   ; CH340 bridge on this CrowPanel is unreliable at 921600
build_flags =
  -D CORE_DEBUG_LEVEL=3

; --------------------------------------------------------------------------
; Display controller — Elecrow CrowPanel ESP32 5.79" e-paper (ESP32-S3, 8MB flash, 8MB PSRAM)
; Board/memory settings per the panel's known-good config.
; --------------------------------------------------------------------------
[env:display_controller]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags =
  ${env.build_flags}
  -D BOARD_HAS_PSRAM
  -D ROLE_DISPLAY_CONTROLLER
  -D DEVICE_NAME=\"display-epaper-01\"
  -D NODE_ID=3
  -D USE_DISPLAY
; lib_deps intentionally empty for now — display driver + Adafruit GFX added once
; the driver approach is chosen (see docs/plans).
