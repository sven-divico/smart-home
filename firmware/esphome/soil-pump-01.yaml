# ESP-Claw node: 1x capacitive soil sensor + 1x pump relay ("Plant 1").
# Board: Adafruit Feather ESP32-S3, 8MB flash, no PSRAM.
# Reference template for ESPHome nodes — shared boilerplate is in common/base.yaml.
#
# Wiring (Feather silkscreen label -> module pin):
#   3V   -> soil VCC        (power sensor at 3.3V so AOUT stays in ADC range)
#   GND  -> soil GND, relay GND
#   A5   -> soil AOUT       (GPIO8 = ADC1, WiFi-safe)
#   USB  -> relay VCC       (5V coil)
#   D6   -> relay IN        (GPIO6 control)
#   relay COM/NO -> pump on a SEPARATE supply (never off the Feather)

substitutions:
  node_name: soil-pump-01
  friendly: "Plant 1"

esphome:
  name: ${node_name}
  friendly_name: ${friendly}

esp32:
  board: adafruit_feather_esp32s3_nopsram
  framework:
    type: esp-idf

# Shared wifi / api / ota / logger / captive_portal.
packages:
  base: !include common/base.yaml

# Onboard red LED (GPIO13) as a physical status beacon:
#   off = all good, blinking = running but not connected.
light:
  - platform: status_led
    name: "${friendly} Status"
    pin: GPIO13

sensor:
  # Raw ADC voltage from the capacitive sensor. Watch this value to calibrate.
  - platform: adc
    pin: GPIO8          # A5
    id: soil_voltage
    name: "${friendly} Soil Voltage"
    attenuation: 12db   # full 0..~3.3V input range
    update_interval: 30s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    filters:
      - median:
          window_size: 5

  # Moisture %, derived from the raw voltage.
  # CALIBRATE: note soil_voltage with the sensor (1) dry in air, (2) tip in water,
  # then replace the two voltages below. Higher voltage = drier for most v1.2 sensors.
  - platform: copy
    source_id: soil_voltage
    id: soil_moisture
    name: "${friendly} Soil Moisture"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:water-percent
    filters:
      - calibrate_linear:
          - 2.60 -> 0     # TODO: voltage when DRY (in air)
          - 1.20 -> 100   # TODO: voltage when WET (in water)
      - lambda: return clamp(x, 0.0f, 100.0f);

switch:
  - platform: gpio
    pin:
      number: GPIO6      # D6
      inverted: true     # active-low "Low Level Trigger" relay board
    id: pump
    name: "${friendly} Pump"
    icon: mdi:water-pump
    # SAFETY: never let the pump run away. Auto-off after 30s no matter what.
    on_turn_on:
      - delay: 30s
      - switch.turn_off: pump
