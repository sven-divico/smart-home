# ESP-Claw node: Waveshare ESP32-S3-Touch-AMOLED-1.75C — HA touch control panel.
#
# PHASE 2: LVGL dashboard — Plant 1 moisture ring (from HA) + a pump button (to HA).
# Phase-1 bring-up (display/touch/wifi) confirmed; see git history + README.
#
# Hardware blocks follow the official ESPHome device page:
#   https://devices.esphome.io/devices/waveshare-esp32-s3-touch-amoled-175/

substitutions:
  node_name: amoled-panel-01
  friendly: "Garden Panel"
  # HA entity ids this panel reads/controls. After the soil-pump entity-name cleanup
  # HA regenerated these with the AREA ("Garten") prefixed: garten_plant_1_*.
  # (Verify in HA Developer Tools → States if they ever change, e.g. area rename.)
  moisture_entity: sensor.garten_plant_1_soil_moisture
  pump_entity: switch.garten_plant_1_pump

esphome:
  name: ${node_name}
  friendly_name: ${friendly}
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L

esp32:
  variant: esp32s3
  # Chip actually has 32MB, but 32MB+OTA needs ESPHome's experimental partitions.
  # 16MB is plenty for app+OTA and stays on stable partitions; the rest is unused.
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# Shared wifi / api / ota / logger / captive_portal.
packages:
  base: !include common/base.yaml

# The CST9217 touch driver isn't in stable ESPHome yet — external component.
# Vendored in-tree under components/cst9217/ (from shelson/esphome-cst9217 @
# 126c0174, MIT) so we own the source. Patched for the ESPHome 2026.6 removal of
# status_set_error(const char*) — see components/cst9217/README.md. Drop this
# block + the directory if/when cst9217 lands in mainline ESPHome.
external_components:
  - source:
      type: local
      path: components
    components: [cst9217, axp2101_batt]

# --- Display: QSPI AMOLED, CO5300 driver, 466x466 round (LVGL drives it) ---
spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO38
    data_pins: [GPIO4, GPIO5, GPIO6, GPIO7]

display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    bus_mode: quad
    reset_pin: GPIO39
    cs_pin: GPIO12
    dimensions:
      width: 466
      height: 466
    auto_clear_enabled: false

# Backlight brightness routed through the display driver.
output:
  - platform: template
    id: backlight_brightness
    type: float
    write_action:
      - lambda: id(disp1).set_brightness(state * 255);

light:
  - platform: monochromatic
    id: display_backlight
    name: "${friendly} Backlight"
    output: backlight_brightness
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 76
    glyphs: "-0123456789%°"
  - file: "gfonts://Roboto"
    id: font_med
    size: 26
    glyphs: " !%()+=,-_.:°/0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
  - file: "gfonts://Roboto"
    id: font_small
    size: 17
    glyphs: " !%()+=,-_.:°/0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"

# --- Touch: CST9217 over I2C (LVGL consumes it) ---
i2c:
  - id: bus_a
    sda: GPIO15
    scl: GPIO14

touchscreen:
  - platform: cst9217
    display: disp1
    id: ts_disp1
    interrupt_pin: GPIO11
    reset_pin: GPIO40
    transform:
      mirror_x: true
      mirror_y: true
    # Manual swipe detection (ESPHome LVGL has no built-in gesture): remember the
    # touch-down x, and on release decide a left/right swipe to change pages.
    on_touch:
      - lambda: |-
          id(swipe_x0) = touch.x;
          id(swipe_x1) = touch.x;
          id(swipe_down) = true;
    on_update:
      - lambda: |-
          if (!touches.empty()) id(swipe_x1) = touches[0].x;
    on_release:
      - lambda: 'ESP_LOGD("swipe", "dx=%d", id(swipe_x1) - id(swipe_x0));'
      - if:
          condition:
            lambda: 'return id(swipe_down) && (id(swipe_x1) - id(swipe_x0)) <= -40;'
          then:
            - lvgl.page.next:
      - if:
          condition:
            lambda: 'return id(swipe_down) && (id(swipe_x1) - id(swipe_x0)) >= 40;'
          then:
            - lvgl.page.previous:
      - lambda: 'id(swipe_down) = false;'

globals:
  - id: swipe_x0
    type: int
    restore_value: no
    initial_value: '0'
  - id: swipe_x1
    type: int
    restore_value: no
    initial_value: '0'
  - id: swipe_down
    type: bool
    restore_value: no
    initial_value: 'false'

# --- Live data + control from/to Home Assistant ---
sensor:
  - platform: homeassistant
    id: ha_plant1_moisture
    entity_id: ${moisture_entity}
    on_value:
      - lvgl.arc.update:
          id: moisture_arc
          value: !lambda 'return x;'
      - lvgl.label.update:
          id: moisture_value
          text: !lambda 'return str_sprintf("%.0f%%", x);'

  # Current weather (temperature + humidity attributes of the HA weather entity).
  - platform: homeassistant
    id: ha_weather_temp
    entity_id: weather.forecast_home
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: weather_temp
          text: !lambda 'return str_sprintf("%.0f°", x);'
  - platform: homeassistant
    id: ha_weather_humidity
    entity_id: weather.forecast_home
    attribute: humidity
    on_value:
      - lvgl.label.update:
          id: weather_humidity
          text: !lambda 'return str_sprintf("%.0f%% humidity", x);'

  # Panel battery via the AXP2101 PMU (read-only). Shown top bar + auto-sent to HA.
  - platform: axp2101_batt
    i2c_id: bus_a
    address: 0x34
    update_interval: 30s
    battery_level:
      id: batt_level
      name: "Panel Battery"
      on_value:
        - lvgl.label.update:
            id: batt_label
            text: !lambda 'return str_sprintf("%d%%", (int) x);'

text_sensor:
  # Current weather condition (state of the HA weather entity), prettified.
  - platform: homeassistant
    id: ha_weather_cond
    entity_id: weather.forecast_home
    on_value:
      - lvgl.label.update:
          id: weather_cond
          text: !lambda |-
            if (x == "partlycloudy") return std::string("Partly cloudy");
            if (x == "clear-night")  return std::string("Clear night");
            if (x == "lightning-rainy") return std::string("Thunderstorm");
            if (x == "snowy-rainy")  return std::string("Sleet");
            std::string s = x;
            if (!s.empty()) s[0] = toupper(s[0]);
            return s;

  # 3-day forecast lines from the HA template package (see home-assistant/packages/).
  - platform: homeassistant
    id: ha_fc_d1
    entity_id: sensor.forecast_day1_line
    on_value:
      - lvgl.label.update: { id: fc_d1, text: !lambda 'return x;' }
  - platform: homeassistant
    id: ha_fc_d2
    entity_id: sensor.forecast_day2_line
    on_value:
      - lvgl.label.update: { id: fc_d2, text: !lambda 'return x;' }
  - platform: homeassistant
    id: ha_fc_d3
    entity_id: sensor.forecast_day3_line
    on_value:
      - lvgl.label.update: { id: fc_d3, text: !lambda 'return x;' }

binary_sensor:
  # Pump on/off state mirrored from HA, to relabel the button.
  - platform: homeassistant
    id: ha_plant1_pump
    entity_id: ${pump_entity}
    on_state:
      - lvgl.label.update:
          id: pump_btn_label
          text: !lambda 'return std::string(x ? "Pump running" : "Tap to run pump");'
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.widget.update:
                id: pump_btn
                bg_color: 0x1D9E75
                border_color: 0x7FE3C2
            - lvgl.label.update:
                id: pump_btn_label
                text_color: 0x06281F
          else:
            - lvgl.widget.update:
                id: pump_btn
                bg_color: 0x0F2A22
                border_color: 0x1D9E75
            - lvgl.label.update:
                id: pump_btn_label
                text_color: 0x7FE3C2
  # This panel's own connection to HA, for the status line.
  - platform: status
    id: ha_connected
    on_state:
      - lvgl.label.update:
          id: status_label
          text: !lambda 'return std::string(x ? "HA connected" : "connecting");'

# --- LVGL dashboard ---
lvgl:
  displays:
    - disp1
  touchscreens:
    - ts_disp1
  bg_color: 0x000000
  bg_opa: COVER
  # Battery %, shown on every screen.
  top_layer:
    widgets:
      - label:
          id: batt_label
          align: TOP_MID
          y: 12
          text: ""
          text_color: 0xBFBFBF
          text_font: font_small
  pages:
    # ---------- Screen 1: Plant ----------
    - id: page_plant
      widgets:
        - arc:
            id: moisture_arc
            align: CENTER
            width: 360
            height: 360
            arc_width: 18
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            arc_color: 0x1C1C1C
            indicator:
              arc_color: 0x1D9E75
              arc_width: 18
        - label:
            align: CENTER
            y: -58
            text: "Plant 1"
            text_color: 0x5DCAA5
            text_font: font_med
        - label:
            id: moisture_value
            align: CENTER
            y: 0
            text: "--%"
            text_color: 0xFFFFFF
            text_font: font_big
        - label:
            align: CENTER
            y: 44
            text: "soil moisture"
            text_color: 0x8A8A8A
            text_font: font_small
        - label:
            id: status_label
            align: TOP_MID
            y: 48
            text: "connecting"
            text_color: 0x7D7D7D
            text_font: font_small
        - button:
            id: pump_btn
            align: CENTER
            y: 122
            width: 190
            height: 52
            bg_color: 0x0F2A22
            border_color: 0x1D9E75
            border_width: 2
            radius: 26
            widgets:
              - label:
                  id: pump_btn_label
                  align: CENTER
                  text: "Tap to run pump"
                  text_color: 0x7FE3C2
                  text_font: font_small
            on_click:
              - homeassistant.action:
                  action: switch.toggle
                  data:
                    entity_id: ${pump_entity}
        - obj: { align: BOTTOM_MID, x: -24, y: -16, width: 8, height: 8, radius: 4, bg_color: 0x1D9E75, bg_opa: COVER, border_width: 0 }
        - obj: { align: BOTTOM_MID, x: -8,  y: -16, width: 8, height: 8, radius: 4, bg_color: 0x444444, bg_opa: COVER, border_width: 0 }
        - obj: { align: BOTTOM_MID, x: 8,   y: -16, width: 8, height: 8, radius: 4, bg_color: 0x444444, bg_opa: COVER, border_width: 0 }
        - obj: { align: BOTTOM_MID, x: 24,  y: -16, width: 8, height: 8, radius: 4, bg_color: 0x444444, bg_opa: COVER, border_width: 0 }
    # ---------- Screen 2: Weather (placeholder) ----------
    - id: page_weather
      widgets:
        - label: { align: TOP_MID, y: 44, text: "Weather", text_color: 0x8A8A8A, text_font: font_small }
        - label:
            id: weather_temp
            align: CENTER
            y: -18
            text: "--°"
            text_color: 0xFFFFFF
            text_font: font_big
        - label:
            id: weather_cond
            align: CENTER
            y: 38
            text: ""
            text_color: 0x9AC7E0
            text_font: font_med
        - label:
            id: weather_humidity
            align: CENTER
            y: 70
            text: ""
            text_color: 0x8A8A8A
            text_font: font_small
        - obj: { align: BOTTOM_MID, x: -24, y: -16, width: 8, height: 8, radius: 4, bg_color: 0x444444, bg_opa: COVER, border_width: 0 }
        - obj: { align: BOTTOM_MID, x: -8,  y: -16, width: 8, height: 8, radius: 4, bg_color: 0x1D9E75, bg_opa: COVER, border_width: 0 }
        - obj: { align: BOTTOM_MID, x: 8,   y: -16, width: 8, height: 8, radius: 4, bg_color: 0x444444, bg_opa: COVER, border_width: 0 }
        - obj: { align: BOTTOM_MID, x: 24,  y: -16, width: 8, height: 8, radius: 4, bg_color: 0x444444, bg_opa: COVER, border_width: 0 }
    # ---------- Screen 3: Forecast (placeholder) ----------
    - id: page_forecast
      widgets:
        - label: { align: TOP_MID, y: 44, text: "Forecast", text_color: 0x8A8A8A, text_font: font_small }
        - label: { id: fc_d1, align: CENTER, y: -34, text: "", text_color: 0xFFFFFF, text_font: font_med }
        - label: { id: fc_d2, align: CENTER, y: 2,   text: "", text_color: 0xCFCFCF, text_font: font_med }
        - label: { id: fc_d3, align: CENTER, y: 38,  text: "", text_color: 0xCFCFCF, text_font: font_med }
        - obj: { align: BOTTOM_MID, x: -24, y: -16, width: 8, height: 8, radius: 4, bg_color: 0x444444, bg_opa: COVER, border_width: 0 }
        - obj: { align: BOTTOM_MID, x: -8,  y: -16, width: 8, height: 8, radius: 4, bg_color: 0x444444, bg_opa: COVER, border_width: 0 }
        - obj: { align: BOTTOM_MID, x: 8,   y: -16, width: 8, height: 8, radius: 4, bg_color: 0x1D9E75, bg_opa: COVER, border_width: 0 }
        - obj: { align: BOTTOM_MID, x: 24,  y: -16, width: 8, height: 8, radius: 4, bg_color: 0x444444, bg_opa: COVER, border_width: 0 }
    # ---------- Screen 4: Backlight (placeholder) ----------
    - id: page_light
      widgets:
        - label: { align: TOP_MID, y: 44, text: "Backlight", text_color: 0x8A8A8A, text_font: font_small }
        # Vertical slider (vertical drag = brightness; horizontal stays free for swipe).
        - slider:
            id: backlight_slider
            align: CENTER
            x: -64
            width: 26
            height: 220
            min_value: 40   # safeguard: never dim below 40% (keeps screen readable)
            max_value: 100
            value: 100
            bg_color: 0x1C1C1C
            indicator:
              bg_color: 0xE6E6E6
            knob:
              bg_color: 0xFFFFFF
            on_value:
              - light.turn_on:
                  id: display_backlight
                  brightness: !lambda 'return x / 100.0f;'
              - lvgl.label.update:
                  id: backlight_pct
                  text: !lambda 'return str_sprintf("%d%%", (int) x);'
        - label:
            id: backlight_pct
            align: CENTER
            x: 34
            text: "100%"
            text_color: 0xFFFFFF
            text_font: font_big
        - obj: { align: BOTTOM_MID, x: -24, y: -16, width: 8, height: 8, radius: 4, bg_color: 0x444444, bg_opa: COVER, border_width: 0 }
        - obj: { align: BOTTOM_MID, x: -8,  y: -16, width: 8, height: 8, radius: 4, bg_color: 0x444444, bg_opa: COVER, border_width: 0 }
        - obj: { align: BOTTOM_MID, x: 8,   y: -16, width: 8, height: 8, radius: 4, bg_color: 0x444444, bg_opa: COVER, border_width: 0 }
        - obj: { align: BOTTOM_MID, x: 24,  y: -16, width: 8, height: 8, radius: 4, bg_color: 0x1D9E75, bg_opa: COVER, border_width: 0 }
