# ESP-Claw node: Waveshare ESP32-S3-Touch-AMOLED-1.75C — HA touch control panel.
#
# PHASE 2: LVGL dashboard — Plant 1 moisture ring (from HA) + a pump button (to HA).
# Phase-1 bring-up (display/touch/wifi) confirmed; see git history + README.
#
# Hardware blocks follow the official ESPHome device page:
#   https://devices.esphome.io/devices/waveshare-esp32-s3-touch-amoled-175/

substitutions:
  node_name: amoled-panel-01
  friendly: "Garden Panel"
  # HA entity ids this panel reads/controls — VERIFY against your HA if they differ.
  moisture_entity: sensor.plant_1_soil_moisture
  pump_entity: switch.plant_1_pump

esphome:
  name: ${node_name}
  friendly_name: ${friendly}
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L

esp32:
  variant: esp32s3
  # Chip actually has 32MB, but 32MB+OTA needs ESPHome's experimental partitions.
  # 16MB is plenty for app+OTA and stays on stable partitions; the rest is unused.
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# Shared wifi / api / ota / logger / captive_portal.
packages:
  base: !include common/base.yaml

# The CST9217 touch driver isn't in stable ESPHome yet — external component.
# Vetted 2026-06-22: ~190 lines, I2C + GPIO only (no network/fs/exec), a faithful
# port of the official Waveshare driver. Pinned to the reviewed commit so it can't
# change under us. Re-review before bumping the ref.
external_components:
  - source:
      type: git
      url: https://github.com/shelson/esphome-cst9217
      ref: 126c0174a17857a7496284ab9d06ba5d7a141fbd
    components: [cst9217]

# --- Display: QSPI AMOLED, CO5300 driver, 466x466 round (LVGL drives it) ---
spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO38
    data_pins: [GPIO4, GPIO5, GPIO6, GPIO7]

display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    bus_mode: quad
    reset_pin: GPIO39
    cs_pin: GPIO12
    dimensions:
      width: 466
      height: 466
    auto_clear_enabled: false

# Backlight brightness routed through the display driver.
output:
  - platform: template
    id: backlight_brightness
    type: float
    write_action:
      - lambda: id(disp1).set_brightness(state * 255);

light:
  - platform: monochromatic
    id: display_backlight
    name: "${friendly} Backlight"
    output: backlight_brightness
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 76
    glyphs: "-0123456789%"
  - file: "gfonts://Roboto"
    id: font_med
    size: 26
  - file: "gfonts://Roboto"
    id: font_small
    size: 17

# --- Touch: CST9217 over I2C (LVGL consumes it) ---
i2c:
  - id: bus_a
    sda: GPIO15
    scl: GPIO14

touchscreen:
  - platform: cst9217
    display: disp1
    id: ts_disp1
    interrupt_pin: GPIO11
    reset_pin: GPIO40
    transform:
      mirror_x: true
      mirror_y: true

# --- Live data + control from/to Home Assistant ---
sensor:
  - platform: homeassistant
    id: ha_plant1_moisture
    entity_id: ${moisture_entity}
    on_value:
      - lvgl.arc.update:
          id: moisture_arc
          value: !lambda 'return x;'
      - lvgl.label.update:
          id: moisture_value
          text: !lambda 'return str_sprintf("%.0f%%", x);'

binary_sensor:
  # Pump on/off state mirrored from HA, to relabel the button.
  - platform: homeassistant
    id: ha_plant1_pump
    entity_id: ${pump_entity}
    on_state:
      - lvgl.label.update:
          id: pump_btn_label
          text: !lambda 'return std::string(x ? "Pump running" : "Tap to run pump");'
  # This panel's own connection to HA, for the status line.
  - platform: status
    id: ha_connected
    on_state:
      - lvgl.label.update:
          id: status_label
          text: !lambda 'return std::string(x ? "HA connected" : "connecting");'

# --- LVGL dashboard ---
lvgl:
  displays:
    - disp1
  touchscreens:
    - ts_disp1
  bg_color: 0x000000
  bg_opa: COVER
  widgets:
    - arc:
        id: moisture_arc
        align: CENTER
        width: 360
        height: 360
        arc_width: 18
        min_value: 0
        max_value: 100
        value: 0
        adjustable: false
        arc_color: 0x1C1C1C
        indicator:
          arc_color: 0x1D9E75
          arc_width: 18
    - label:
        align: CENTER
        y: -58
        text: "Plant 1"
        text_color: 0x5DCAA5
        text_font: font_med
    - label:
        id: moisture_value
        align: CENTER
        y: 0
        text: "--%"
        text_color: 0xFFFFFF
        text_font: font_big
    - label:
        align: CENTER
        y: 44
        text: "soil moisture"
        text_color: 0x8A8A8A
        text_font: font_small
    - label:
        id: status_label
        align: TOP_MID
        y: 48
        text: "connecting"
        text_color: 0x7D7D7D
        text_font: font_small
    - button:
        id: pump_btn
        align: CENTER
        y: 122
        width: 190
        height: 52
        bg_color: 0x0F2A22
        border_color: 0x1D9E75
        border_width: 2
        radius: 26
        widgets:
          - label:
              id: pump_btn_label
              align: CENTER
              text: "Tap to run pump"
              text_color: 0x7FE3C2
              text_font: font_small
        on_click:
          - homeassistant.action:
              action: switch.toggle
              data:
                entity_id: ${pump_entity}
